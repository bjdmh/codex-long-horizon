name: rust-release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release-linux-x86_64:
    name: Build Linux x86_64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag matches CLI version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] || {
            echo "expected tag push, got ${GITHUB_REF_TYPE}" >&2
            exit 1
          }

          tag_version="${GITHUB_REF_NAME#v}"
          cli_version="$(grep -m1 '^version' cli/Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"

          [[ "${tag_version}" == "${cli_version}" ]] || {
            echo "tag ${tag_version} does not match cli version ${cli_version}" >&2
            exit 1
          }

      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-unknown-linux-gnu --bin codex

      - name: Prepare release asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          asset_name="codex-${version}-long-horizon-x86_64-unknown-linux-gnu"
          cp target/x86_64-unknown-linux-gnu/release/codex "../${asset_name}"
          echo "asset_name=${asset_name}" >> "${GITHUB_OUTPUT}"
          echo "asset_path=${GITHUB_WORKSPACE}/${asset_name}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git -C "${GITHUB_WORKSPACE}" rev-parse "${GITHUB_SHA}^{commit}")"
          notes_path="${RUNNER_TEMP}/release-notes.md"
          git -C "${GITHUB_WORKSPACE}" log -1 --format=%B "${commit}" > "${notes_path}"
          echo >> "${notes_path}"
          echo "path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: ${{ steps.asset.outputs.asset_path }}
          fail_on_unmatched_files: true
